<div class="main-content">
    <div class="container-fluid">
            <div class="row">
              <div class="col-lg-6 col-md-12">
                  <div class="card">
                      <div class="card-header card-header-primary">
                          <h4 class="card-title ">Vote Balancesheet Sub Titles</h4>
                          <p class="card-category">Create Vote Balancesheet Sub Title</p>
                      </div>
                      <div class="card-body">
               
                            <div *ngIf="isSinhala;">
                                <label>Select Vote Balancesheet Title</label>
                                <select class="form-control" [(ngModel)]="selectedBalancesheetsubtitle.balsheetTitleID" (ngModelChange)="getAllBalancesheetSubtitleByTitleID($event);" >
                                    <option value="0" > --Select Balancesheet Title-- </option>
                                    <option *ngFor=" let balancesheettitle of APIBalancesheettitlesList" [value]="balancesheettitle.id"> {{(balancesheettitle.code +" :: " + balancesheettitle.nameSinhala)}} </option>
                                </select>
                            </div>

                            <div *ngIf="isEnglish;">
                                <label>Select Vote Balancesheet Title</label>
                                <select class="form-control" [(ngModel)]="selectedBalancesheetsubtitle.balsheetTitleID"  (ngModelChange)="getAllBalancesheetSubtitleByTitleID($event);" >
                                    <option value="0" > --Select Balancesheet Title-- </option>
                                    <option *ngFor=" let balancesheettitle of APIBalancesheettitlesList" [value]="balancesheettitle.id"> {{(balancesheettitle.code +" :: " + balancesheettitle.nameEnglish)}} </option>
                                </select>
                            </div>
                            <div *ngIf="isTamil;">
                                <label>Select Vote Balancesheet Title</label>
                                <select class="form-control" [(ngModel)]="selectedBalancesheetsubtitle.balsheetTitleID"  (ngModelChange)="getAllBalancesheetSubtitleByTitleID($event);" >
                                    <option value="0" > --Select Balancesheet Title-- </option>
                                    <option *ngFor=" let balancesheettitle of APIBalancesheettitlesList" [value]="balancesheettitle.id"> {{(balancesheettitle.code +" :: " + balancesheettitle.nameTamil)}} </option>
                                </select>
                            </div>

                              <!-- <input type="text" [(ngModel)]="selectedBalancesheetsubtitle.balancesheettitleID" placeholder="Select Balancesheettitle" class="form-control"required/> -->
                              <br>
                              
                              <input type="text" [(ngModel)]="selectedBalancesheetsubtitle.nameSinhala" placeholder="Type Vote Income Titile Name in Sinhala" class="form-control"required/>
                              <br>
                              <input type="text" [(ngModel)]="selectedBalancesheetsubtitle.nameTamil" placeholder="Type Vote Income Titile Name in Tamil" class="form-control" required/>
                              <br>
                              <input type="text" [(ngModel)]="selectedBalancesheetsubtitle.nameEnglish" placeholder="Type Vote Income Titile Name in English" class="form-control"required/>
                              <br>
                              <input type="text" [(ngModel)]="selectedBalancesheetsubtitle.code" placeholder="Type Vote Income Titile Code" class="form-control" required/>
                              <br>
                              <br>
                              <div class="form-group">
                                <button class="btn btn-success" (click)="updateRecord()">{{(selectedBalancesheetsubtitle.id!==undefined)?'Update':'Create'}}</button>
                                <button class="btn btn-danger" (click)="clearRecord()">Clear</button>
                                <div class="loading" *ngIf="loading">
                                <mat-spinner></mat-spinner>
                            </div>
                      </div>
                  </div>
                </div>
            </div>
              <div class="col-lg-6 col-md-12">
                  <div class="card">
                      <div class="card-header card-header-tabs card-header-primary">
                          <div class="nav-tabs-navigation">
                            <div class="nav-tabs-wrapper">
                                <span class="nav-tabs-title"></span>
                                <ul class="nav nav-tabs" data-tabs="tabs">
                                  <li class="nav-item">
                                      <a mat-button class="nav-link active" href="#inSinhala" data-toggle="tab">
                                          <i class="material-icons"></i> Balancesheet Subtitles List
                                          <div class="ripple-container"></div>
                                      </a>
                                  </li>
                                </ul>
                            </div>
                          </div>
                      </div>
                      <div class="card-body">
                          <div class="tab-content">
                              
                              <div class="tab-pane active" id="inSinhala">
                                  <table class="table">
                                    <tbody>
                                        <tr>
                                            <th>#</th>
                                              <!-- <th>Balancesheet Title</th> -->
                                              <th>Balancesheet Subtitle</th>
                                              <th>Code</th>
                                              <th>Options</th>
                                          </tr>
                                          <tr *ngFor="let balancesheetsubtitle of APIBalancesheetsubtitlesList; index as i">
                                              <td>{{ i+1 }}</td>
                                              <!-- <td>Balancesheettitle</td> -->
                                              <td ><span *ngIf="isSinhala">{{balancesheetsubtitle.nameSinhala}}</span> <span *ngIf="isEnglish">{{balancesheetsubtitle.nameEnglish}}</span> <span *ngIf="isTamil">{{balancesheetsubtitle.nameTamil}}</span> </td> 
                                              <td>{{ balancesheetsubtitle.code }}</td>
                                            <td class="td-actions text-right">
                                                <button mat-raised-button (click)="editBalancesheetsubtitle(balancesheetsubtitle)" type="button" matTooltip="Edit Task" [matTooltipPosition]="'above'" class="btn btn-primary btn-link btn-sm btn-just-icon">
                                                    <i class="material-icons">edit</i>
                                                </button>
                                                <button (click)="deleteBalancesheetsubtitle(balancesheetsubtitle)" mat-raised-button type="button" matTooltip="Remove" [matTooltipPosition]="'above'" class="btn btn-danger btn-link btn-sm btn-just-icon">
                                                    <i class="material-icons">close</i>
                                                </button>
                                            </td>
                                        </tr>
                                    </tbody>
                                  </table>
                              </div>
                              
                          </div>
                      </div>
                  </div>
              </div>
          
        </div>
    </div>
  </div>
