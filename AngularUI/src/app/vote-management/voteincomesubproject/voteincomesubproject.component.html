<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <div class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h4 class="m-0">Vote Income Sub Projects</h4>
          </div><!-- /.col -->
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item">Vote Management</li>
              <li class="breadcrumb-item active">Vote Income Sub Projects</li>
            </ol>
          </div><!-- /.col -->
        </div><!-- /.row -->
      </div><!-- /.container-fluid -->
    </div>
    <!-- /.content-header -->

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
            <div class="row">
              <div class="col-lg-4 col-md-12">
                  <div class="card card-primary">
                      <div class="card-header card-header-primary">
                          <h4 class="card-title ">Create Vote Income Sub Project</h4>
                          <!-- <p class="card-category">Create Vote Programme</p> -->
                          <div class="card-tools">
                            <button type="button" class="btn btn-tool" data-card-widget="collapse" title="Collapse">
                              <i class="fas fa-minus"></i>
                            </button>
                          </div>
                        </div>
                      <div class="card-body">
                            <div *ngIf="isSinhala;">
                                <label>Select Vote Programme</label>
                                <select class="form-control" [(ngModel)]="selectedSubProject.programmeID" (ngModelChange)="getAlldataforProgrammeId($event);">
                                    <option value="0"> --Select a Programme--</option>
                                    <option *ngFor=" let programme of APIProgrammesList" [value]="programme.id" > {{(programme.code +" :: " + programme.nameSinhala)}} </option>
                                </select>
                            </div>

                            <div *ngIf="isEnglish;">
                                <label>Select Vote Programme</label>
                                <select class="form-control" [(ngModel)]="selectedSubProject.programmeID" (ngModelChange)="getAlldataforProgrammeId($event);">
                                    <option value="0"> --Select a Programme--</option>
                                    <option *ngFor=" let programme of APIProgrammesList" [value]="programme.id" > {{(programme.code +" :: " + programme.nameEnglish)}} </option>
                                </select>
                            </div>
                            <div *ngIf="isTamil;">
                                <label>Select Vote Programme</label>
                                <select class="form-control" [(ngModel)]="selectedSubProject.programmeID" (ngModelChange)="getAlldataforProgrammeId($event);">
                                    <option value="0"> --Select a Programme--</option>
                                    <option *ngFor=" let programme of APIProgrammesList" [value]="programme.id" > {{(programme.code +" :: " + programme.nameTamil)}} </option>
                                </select>
                            </div>
                            
                            <div *ngIf="isSinhala;">
                                <label>Select Vote Income Project</label>
                                <select class="form-control" [(ngModel)]="selectedSubProject.projectID">
                                    <option value="0"> --Select Vote Income Project-</option>
                                    <option *ngFor=" let project of APIProjectsListByProgramme" [value]="project.id"> {{(project.code +" :: " + project.nameSinhala)}} </option>
                                </select>
                            </div>
    
                            <div *ngIf="isEnglish;">
                                <label>Select Vote Income Project</label>
                                <select class="form-control" [(ngModel)]="selectedSubProject.projectID">
                                    <option value="0"> --Select Vote Income Project-</option>
                                    <option *ngFor=" let project of APIProjectsListByProgramme" [value]="project.id"> {{(project.code +" :: " + project.nameEnglish)}} </option>
                                </select>
                            </div>
                            <div *ngIf="isTamil;">
                                <label>Select Vote Income Project</label>
                                <select class="form-control" [(ngModel)]="selectedSubProject.projectID">
                                    <option value="0"> --Select Vote Income Project-</option>
                                    <option *ngFor=" let project of APIProjectsListByProgramme" [value]="project.id"> {{(project.code +" :: " + project.nameTamil)}} </option>
                                </select>
                            </div>
                              <br>
                              
                              <input type="text" [(ngModel)]="selectedSubProject.nameSinhala" placeholder="Type Income Sub Project Name in Sinhala" class="form-control"required/>
                              <br>
                              <input type="text" [(ngModel)]="selectedSubProject.nameTamil" placeholder="Type Income Sub Project Name in Tamil" class="form-control" required/>
                              <br>
                              <input type="text" [(ngModel)]="selectedSubProject.nameEnglish" placeholder="Type Income Sub Project Name in English" class="form-control"required/>
                              <br>
                              <input type="text" [(ngModel)]="selectedSubProject.code" placeholder="Type Income Sub Project Code" class="form-control" required/>
                              <br>
                              <br>
                              <div class="form-group">
                                <button class="btn btn-success" (click)="updateRecord()">{{(selectedSubProject.id!==undefined)?'Update':'Create'}}</button>
                                &nbsp;
                                <button class="btn btn-danger" (click)="clearRecord()">Clear</button>
                                <!-- <div class="loading" *ngIf="loading">
                                <mat-spinner></mat-spinner>
                            </div> -->
                      </div>
                  </div>
                </div>
            </div>
    <div class="col-lg-8 col-md-12">
    <div class="card card-info">
        <div class="card-header">
          <h3 class="card-title">Vote Income Sub Projects List</h3>

          <div class="card-tools">
            <button type="button" class="btn btn-tool" data-card-widget="collapse" title="Collapse">
              <i class="fas fa-minus"></i>
            </button>
          </div>
        </div>
          <div class="card-body">
              <div class="tab-content">
                  
                  <div class="tab-pane active" id="inSinhala">
                      <table class="table">
                        <tbody>
                            <tr>
                                <th>#</th>
                                <!-- <th>Project</th> -->
                                <th>Sub Project</th>
                                <th>Code</th>
                                <th class="text-center">Options</th>
                            </tr>
                            <tr>
                            <tr *ngFor="let subProjects of APISubProjectsListForProgrammeId; index as i">
                                <td>{{ i+1 }}</td>
                                <!-- <td>Project</td> -->
                                  <td ><span *ngIf="isSinhala">{{subProjects.nameSinhala}}</span> <span *ngIf="isEnglish">{{subProjects.nameEnglish}}</span> <span *ngIf="isTamil">{{subProjects.nameTamil}}</span> </td> 
                                  <td>{{ subProjects.code }}</td>
                                <td class="td-actions text-center">
                                    <button mat-flat-button (click)="editSubProject(subProjects)" type="button" matTooltip="Edit Task" [matTooltipPosition]="'above'" class="btn">
                                        <i class="fas fa-edit text-primary"></i>
                                    </button>
                                    <button (click)="deleteSubProject(subProjects)" mat-flat-button type="button" matTooltip="Remove" [matTooltipPosition]="'above'" class="btn">
                                        <i class="fas fa-trash text-danger"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                      </table>
                  </div>
                  
              </div>
          </div>
      </div>
  </div>

</div>
</div><!-- /.container-fluid -->
</section>
</div>
