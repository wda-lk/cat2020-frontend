  <!-- Content Wrapper. Contains page content -->
<div *ngIf="haspermission || isadmin"  class="content-wrapper">
    <!-- Content Header (Page header) -->
    <div class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h4 class="m-0">Vote Programmes</h4>
          </div><!-- /.col -->
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item">Vote Management</li>
              <li class="breadcrumb-item active">Vote Programmes</li>
            </ol>
          </div><!-- /.col -->
        </div><!-- /.row -->
      </div><!-- /.container-fluid -->
    </div>
    <!-- /.content-header -->
    
    <!-- Main content -->
    <section  class="content">
      <div class="container-fluid">
            <div class="row">
              <div class="col-lg-5 col-md-12">
                  <div class="card card-primary">
                      <div class="card-header card-header-primary">
                          <h4 class="card-title ">Create Vote Programme</h4>
                          <div class="card-tools">
                            <button type="button" class="btn btn-tool" data-card-widget="collapse" title="Collapse">
                              <i class="fas fa-minus"></i>
                            </button>
                          </div>
                        </div>
                      <div class="card-body">
                            <input type="text" [(ngModel)]="selectedProgramme.nameSinhala" placeholder="Type programme name in Sinhala" class="form-control"required/>
                            <br>
                              <input type="text" [(ngModel)]="selectedProgramme.nameTamil" placeholder="Type programme name in Tamil" class="form-control" required/>
                              <br>
                              <input type="text" [(ngModel)]="selectedProgramme.nameEnglish" placeholder="Type programme name in English" class="form-control"required/>
                              <br>
                              <input type="text" [(ngModel)]="selectedProgramme.code" placeholder="Type programme Code" class="form-control" required/>
                              <br>
                              <br>
                              <div class="form-group">
                                <button class="btn btn-success" (click)="updateProgramme()">{{(selectedProgramme.id!==undefined)?'Update':'Create'}}</button>
                                &nbsp;
                                <button class="btn btn-danger" (click)="clearProgramme()">Clear</button>
                                <div class="loading" *ngIf="loading">
                                 <ngx-spinner type="ball-scale-multiple"></ngx-spinner>
                            </div>
                      </div>
                  </div>
                </div>
            </div>
              <div class="col-lg-7 col-md-12">
                <div class="card card-info">
                    <div class="card-header">
                      <h3 class="card-title">Vote Programmes List</h3>
        
                      <div class="card-tools">
                        <button type="button" class="btn btn-tool" data-card-widget="collapse" title="Collapse">
                          <i class="fas fa-minus"></i>
                        </button>
                      </div>
                    </div>
                      <div class="card-body">
                          <div class="tab-content">
                              
                              <div class="tab-pane active" id="inSinhala">
                                  <table class="table">
                                    <tbody>
                                        <tr>
                                            <th>#</th>
                                            <th>Programme</th>
                                            <th>Code</th>
                                            <th class="text-center">Options</th>
                                        </tr>
                                        <tr *ngFor="let programme of APIProgrammesList; index as i">
                                            <td>{{ i+1 }}</td>
                                            <td ><span *ngIf="isSinhala">{{programme.nameSinhala}}</span> <span *ngIf="isEnglish">{{programme.nameEnglish}}</span> <span *ngIf="isTamil">{{programme.nameTamil}}</span> </td> 
                                            <td>{{ programme.code }}</td>
                                            <td class="td-actions text-center">
                                                <button mat-flat-button (click)="editProgramme(programme)" type="button">
                                                  <i class="fas fa-edit text-primary"></i>
                                                </button>
                                                <button (click)="deleteProgramme(programme)" mat-flat-button type="button">
                                                  <i class="fas fa-trash text-danger"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    </tbody>
                                  </table>
                              </div>
                              
                          </div>
                      </div>
                  </div>
              </div>
          
        </div>
    </div><!-- /.container-fluid -->
</section>
</div>
