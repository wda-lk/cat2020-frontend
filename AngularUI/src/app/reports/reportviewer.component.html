
  <!-- Content Wrapper. Contains page content -->
<div *ngIf="haspermission || isadmin"  class="content-wrapper">
  <!-- Content Header (Page header) -->
  <div class="content-header">
    <div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6">
          <h4 class="m-0">Mix Income Sarap Receipts Daily Report</h4>
        </div><!-- /.col -->
        <div class="col-sm-6">
          <ol class="breadcrumb float-sm-right">

            <li class="breadcrumb-item active">Reports
            </li>
          </ol>
        </div><!-- /.col -->
      </div><!-- /.row -->
    </div><!-- /.container-fluid -->
  </div>
  <!-- /.content-header -->
  <!-- Main content -->
  <section class="content">
    <div class="container-fluid">
          <div class="row">
          <div class="col-lg-12 col-md-12">
              <div class="card card-info">
                  <div class="card-header">
                    <h3 class="card-title"> Report Filter Parameters
                    </h3>
                    <div class="card-tools">
                      <button type="button" class="btn btn-tool" data-card-widget="collapse" title="Collapse">
                        <i class="fas fa-minus"></i>
                      </button>
                    </div>
                  </div>
                  <div class="card-body">
                    <div class="row form-group">
                    <div class="col-md-6">

                      <!-- <div class="container"> -->

                        </div> -->

                        </div> -->

  <mat-form-field>
    <mat-label>Pick a date</mat-label>
    <input matInput

  </mat-form-field>

                    </div>
                    <div class="col-md-6">
                      <a class="btn btn-success" (click)="PreviewReport()">View Report </a> &nbsp;&nbsp;
                      <!-- <a class="btn btn-success" (click)="Print()">Print </a> &nbsp;&nbsp; -->
                      Export :
                      <a class="btn btn-success" (click)="ExportToPdf()">To PDF</a> &nbsp;&nbsp;
                      <a class="btn btn-success" (click)="ExportToExcel()"> To Excel</a>  &nbsp;&nbsp;
                      <a class="btn btn-success" (click)="ExportToWord()"> To Word</a>  
                  </div>
                    </div>
                  </div>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-lg-12 col-md-12">
          <pdf-viewer
          [src]="pdfSrc"
          [render-text]="true"
          [original-size]="false"
          style="width: 100%; height: 600px"
          [rotation]="0"
          [show-all]="true"
          [fit-to-page]="false"
          [zoom]="1"
          [zoom-scale]="'page-width'"
          [stick-to-page]="false"
          [external-link-target]="'blank'"
          [autoresize]="true"
          [show-borders]="false"
        ></pdf-viewer>
      </div>
    </div>
  </div><!-- /.container-fluid -->
</section>
</div>
