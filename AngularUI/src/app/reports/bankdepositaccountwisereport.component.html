
  <!-- Content Wrapper. Contains page content -->
<div *ngIf="haspermission || isadmin"  class="content-wrapper">
  <!-- Content Header (Page header) -->
  <div class="content-header">
    <div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6">
          <h4 class="m-0">Bank Deposit Information By Account </h4>
        </div><!-- /.col -->
        <div class="col-sm-6">
          <ol class="breadcrumb float-sm-right">
            <li class="breadcrumb-item">CAT2020</li>
            <li class="breadcrumb-item active">Reports
            </li>
          </ol>
        </div><!-- /.col -->
      </div><!-- /.row -->
    </div><!-- /.container-fluid -->
  </div>
  <!-- /.content-header -->
  <!-- Main content -->
  <section class="content">
    <div class="container-fluid">
          <div class="row">
          <div class="col-lg-12 col-md-12">
              <div class="card card-info">
                  <div class="card-header">
                    <h3 class="card-title"> Filter Parameters
                    </h3>
                    <div class="card-tools">
                      <button type="button" class="btn btn-tool" data-card-widget="collapse" title="Collapse">
                        <i class="fas fa-minus"></i>
                      </button>
                    </div>
                  </div>
                  <div class="card-body">
                    <div class="row form-group">
                    <div class="col-md-8">
                      <br>
                      <mat-datepicker-toggle [for]="resultPicker"></mat-datepicker-toggle>
  <mat-form-field>
    <mat-label>Pick a date</mat-label>
    <input matInput
           #resultPickerModel="ngModel"
           [matDatepicker]="resultPicker"
           [(ngModel)]="selectedDate"
           >
    <mat-datepicker #resultPicker>
    </mat-datepicker>
  </mat-form-field>
                      <!-- <input type="text" [(ngModel)]="selectedDate" placeholder="Select Date" class="form-control col-md-3" required/> -->
                    </div>
                    <div class="col-md-4">
                      <br>
                      <a class="btn btn-success" (click)="LoadReport(selectedDate)">View Report </a> &nbsp;&nbsp;
                      <!-- <a class="btn btn-success" (click)="Print()">Print </a> &nbsp;&nbsp; -->
                      <!-- <a class="btn btn-info" (click)="Print(selectedDate)"><i class="fas fa-print"></i> &nbsp; Print</a>  -->
                       &nbsp; &nbsp; &nbsp; &nbsp;
                      Export :
                      <!-- <a class="btn btn-success" (click)="ExportToPdf()">To PDF</a> &nbsp;&nbsp; -->
                      <a class="btn btn-success" (click)="ExportToExcel(selectedDate)"> <i class="fas fa-file-excel"></i> &nbsp; Excel</a>  &nbsp;&nbsp;
                      <!-- <a class="btn btn-success" (click)="ExportToWord()"> To Word</a>   -->
                  </div>
                    </div>
                  </div>
          </div>
        </div>
      </div>
    <div *ngIf="doc!=null" class="card card-info">
      <div class="card-body">
  <div [innerHTML]="reportpreview"></div>
</div>
</div>
  </div><!-- /.container-fluid -->
</section>
</div>
