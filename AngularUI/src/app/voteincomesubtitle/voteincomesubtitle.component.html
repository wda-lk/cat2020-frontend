<div class="main-content">
    <div class="container-fluid">
            <div class="row">
              <div class="col-lg-6 col-md-12">
                  <div class="card">
                      <div class="card-header card-header-primary">
                          <h4 class="card-title ">Vote Income Sub Titles</h4>
                          <p class="card-category">Create Vote Income Sub Title</p>
                      </div>
                      <div class="card-body">
                            
                            <div *ngIf="isSinhala;">
                                <label>Select Vote Programme</label>
                                <select class="form-control" [(ngModel)]="selectedIncomeSubTitle.programmeID" (ngModelChange)="getAllDataForProgramme($event);">
                                    <option value="0"> --Select Vote Programme--</option>
                                    <option *ngFor=" let programme of APIProgrammesList" [value]="programme.id" > {{(programme.code +" :: " + programme.nameSinhala)}} </option>
                                </select>
                            </div>

                            <div *ngIf="isEnglish;">
                                <label>Select Vote Programme</label>
                                <select class="form-control" [(ngModel)]="selectedIncomeSubTitle.programmeID" (change)="getAllDataForProgramme();">
                                    <option value="0"> --Select Vote Programme--</option>
                                    <option *ngFor=" let programme of APIProgrammesList" [value]="programme.id" > {{(programme.code +" :: " + programme.nameEnglish)}} </option>
                                </select>
                            </div>
                            <div *ngIf="isTamil;">
                                <label>Select Vote Programme</label>
                                <select class="form-control" [(ngModel)]="selectedIncomeSubTitle.programmeID" (change)="getAllDataForProgramme();">
                                    <option value="0"> --Select Vote Programme--</option>
                                    <option *ngFor=" let programme of APIProgrammesList" [value]="programme.id" > {{(programme.code +" :: " + programme.nameTamil)}} </option>
                                </select>
                            </div>
                           
                            <div *ngIf="isSinhala;">
                                <label>Select Vote Income Title</label>
                                <select class="form-control" [(ngModel)]="selectedIncomeSubTitle.incomeTitleID">
                                    <option value="0"> --Select Vote Income Title--</option>
                                    <option *ngFor=" let incometitle of APIIncomeTitlesListByProgramme" [value]="incometitle.id"> {{(incometitle.code +" :: " + incometitle.nameSinhala)}} </option>
                                </select>
                            </div>
    
                            <div *ngIf="isEnglish;">
                                <label>Select Vote Income Title</label>
                                <select class="form-control" [(ngModel)]="selectedIncomeSubTitle.incomeTitleID">
                                    <option value="0"> --Select Vote Income Title--</option>
                                    <option *ngFor=" let incometitle of APIIncomeTitlesListByProgramme" [value]="incometitle.id"> {{(incometitle.code +" :: " + incometitle.nameEnglish)}} </option>
                                </select>
                            </div>
                            <div *ngIf="isTamil;">
                                <label>Select Vote Income Title</label>
                                <select class="form-control" [(ngModel)]="selectedIncomeSubTitle.incomeTitleID">
                                    <option value="0"> --Select Vote Income Title--</option>
                                    <option *ngFor=" let incometitle of APIIncomeTitlesListByProgramme" [value]="incometitle.id"> {{(incometitle.code +" :: " + incometitle.nameTamil)}} </option>
                                </select>
                            </div>
                            <br>
                              <input type="text" [(ngModel)]="selectedIncomeSubTitle.nameSinhala" placeholder="Type Income Sub Titile Name in Sinhala" class="form-control"required/>
                              <br>
                              
                              <input type="text" [(ngModel)]="selectedIncomeSubTitle.nameTamil" placeholder="Type Income Sub Titile Name in Tamil" class="form-control" required/>
                              <br>
                              <input type="text" [(ngModel)]="selectedIncomeSubTitle.nameEnglish" placeholder="Type Income Sub Titile Name in English" class="form-control"required/>
                              <br>
                              <input type="text" [(ngModel)]="selectedIncomeSubTitle.code" placeholder="Type Income Sub Titile Code" class="form-control" required/>
                              <br>
                              <br>
                              <div class="form-group">
                                <button class="btn btn-success" (click)="updateRecord()">{{(selectedIncomeSubTitle.id!==undefined)?'Update':'Create'}}</button>
                                <button class="btn btn-danger" (click)="clearRecord()">Clear</button>
                                <div class="loading" *ngIf="loading">
                                <mat-spinner></mat-spinner>
                            </div>
                      </div>
                  </div>
                </div>
            </div>
              <div class="col-lg-6 col-md-12">
                  <div class="card">
                      <div class="card-header card-header-tabs card-header-primary">
                          <div class="nav-tabs-navigation">
                              <div class="nav-tabs-wrapper">
                                  <span class="nav-tabs-title"></span>
                                  <ul class="nav nav-tabs" data-tabs="tabs">
                                    <li class="nav-item">
                                        <a mat-button class="nav-link active" href="#inSinhala" data-toggle="tab">
                                            <i class="material-icons"></i> Vote Income Subtitles List 
                                            <div class="ripple-container"></div>
                                        </a>
                                    </li>
                                   
                                  </ul>
                              </div>
                          </div>
                      </div>
                      <div class="card-body">
                          <div class="tab-content">
                              
                              <div class="tab-pane active" id="inSinhala">
                                  <table class="table">
                                    <tbody>
                                        <tr>
                                            <th>#</th>
                                            <!-- <th>Income Title</th> -->
                                            <th>Income Sub Title</th>
                                            <th>Code</th>
                                            <th>Options</th>
                                        </tr>
                                        <tr *ngFor="let incomeSubTitile of APIIncomeSubTitlesForProgrammeList; index as i">
                                            <td>{{ i+1 }}</td>
                                            <!-- <td>Income Title</td> -->
                                              <td ><span *ngIf="isSinhala">{{incomeSubTitile.nameSinhala}}</span> <span *ngIf="isEnglish">{{incomeSubTitile.nameEnglish}}</span> <span *ngIf="isTamil">{{incomeSubTitile.nameTamil}}</span> </td> 
                                              <td>{{ incomeSubTitile.code }}</td>
                                            <td class="td-actions text-right">
                                                <button mat-raised-button (click)="editIncomeSubTitle(incomeSubTitile)" type="button" matTooltip="Edit Task" [matTooltipPosition]="'above'" class="btn btn-primary btn-link btn-sm btn-just-icon">
                                                    <i class="material-icons">edit</i>
                                                </button>
                                                <button (click)="deleteIncomeSubTitle(incomeSubTitile)" mat-raised-button type="button" matTooltip="Remove" [matTooltipPosition]="'above'" class="btn btn-danger btn-link btn-sm btn-just-icon">
                                                    <i class="material-icons">close</i>
                                                </button>
                                            </td>
                                        </tr>
                                    </tbody>
                                  </table>
                              </div>
                              
                          </div>
                      </div>
                  </div>
              </div>
          
        </div>
    </div>
  </div>
