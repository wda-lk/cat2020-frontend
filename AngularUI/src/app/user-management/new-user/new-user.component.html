<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <div class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h4 class="m-0">New User</h4>
          </div><!-- /.col -->
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item">User Management</li>
              <li class="breadcrumb-item active">New User</li>
            </ol>
          </div><!-- /.col -->
        </div><!-- /.row -->
      </div><!-- /.container-fluid -->
    </div>
    <!-- /.content-header -->

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
            <div class="row">
              <div class="col-lg-6 col-md-12">
                  <div class="card card-primary">
                      <div class="card-header card-header-primary">
                          <h4 class="card-title ">Create New User</h4>
                          <!-- <p class="card-category">Create Vote Programme</p> -->
                          <div class="card-tools">
                            <button type="button" class="btn btn-tool" data-card-widget="collapse" title="Collapse">
                              <i class="fas fa-minus"></i>
                            </button>
                          </div>
                        </div>
                      <div class="card-body">
              <div id="typography">
                  <!-- <form #simpleForm="ngForm"> -->
                      <input  [(ngModel)]="model.username" placeholder="Email (Username)" class="form-control" />
                     <br>
                      <div class="form-group">
                          <input Value="CREATE" (click)="saveUser()" class="btn btn-success col-2">&nbsp;
                          <input type="reset" Value="Clear" class="btn btn-danger col-2">
                      </div>
                  <!-- </form> -->
              </div>
          </div>
                </div>
            </div>
            <div class="col-lg-6 col-md-12">
                <div class="card card-info">
                    <div class="card-header">
                      <h3 class="card-title">Registered Users List</h3>
        
                      <div class="card-tools">
                        <button type="button" class="btn btn-tool" data-card-widget="collapse" title="Collapse">
                          <i class="fas fa-minus"></i>
                        </button>
                      </div>
                    </div>
                      <div class="card-body">
                          <div class="tab-content">
                              
                              <div class="tab-pane active" id="inSinhala">
                                  <table class="table">
                                    <tbody>
                                        <tr>
                                          <th>#</th>
                                          <th>Username</th>
                                          <th>Name with Initials</th>
                                      </tr>
                                      <tr *ngFor="let user of UserList; index as i">
                                          <td>{{ i+1 }}</td>
                                          <td>{{ user.username }}</td>
                                          <td>{{ user.nameWithInitials }}</td>
                                          <td class="td-actions text-right">
                                              <!-- <button (click)="deleteProgramme(programme)" mat-raised-button type="button" matTooltip="Remove" [matTooltipPosition]="'above'" class="btn btn-danger btn-link btn-sm btn-just-icon">
                                                  <i class="material-icons">close</i>
                                              </button> -->
                                            </td>
                                        </tr>
                                    </tbody>
                                  </table>
                              </div>
                              
                          </div>
                      </div>
                  </div>
              </div>
          
        </div>
    </div><!-- /.container-fluid -->
</section>
</div>
