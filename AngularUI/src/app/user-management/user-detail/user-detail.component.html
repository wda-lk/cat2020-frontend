  <!-- Content Wrapper. Contains page content -->
<div *ngIf="haspermission || isadmin"  class="content-wrapper">
  <!-- Content Header (Page header) -->
  <div class="content-header">
    <div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6">
          <h4 class="m-0">User Details</h4>
        </div><!-- /.col -->
        <div class="col-sm-6">
          <ol class="breadcrumb float-sm-right">
            <li class="breadcrumb-item">User Management</li>
            <li class="breadcrumb-item active">User Details</li>
          </ol>
        </div><!-- /.col -->
      </div><!-- /.row -->
    </div><!-- /.container-fluid -->
  </div>
  <!-- /.content-header -->

  <!-- Main content -->
  <section class="content">
    <div class="container-fluid">
          <div class="row">
            
            <div class="col-lg-6 col-md-12">
                <div class="card card-primary">
                    <div class="card-header card-header-primary">
                        <h4 class="card-title ">Update User Details</h4>
                        <!-- <p class="card-category">Create Vote Programme</p> -->
                        <div class="card-tools">
                          <button type="button" class="btn btn-tool" data-card-widget="collapse" title="Collapse">
                            <i class="fas fa-minus"></i>
                          </button>
                        </div>
                      </div>
                    <div class="card-body">
                            <label>Name in Full</label>
                            <input type="text" [(ngModel)]="selectedUserDetail.nameInFull" placeholder="Type Full Name" class="form-control"  />
                            <br>
                            <label>Name with Initials</label>
                            <input type="text" [(ngModel)]="selectedUserDetail.nameWithInitials" placeholder="Type Name with Initials" class="form-control"  />
                            <br>
                            <label>NIC</label>
                            <input type="text" [(ngModel)]="selectedUserDetail.nic" placeholder="Type NIC" class="form-control"  />
                            <br>

                            <label>Date of Birth</label>
                            <div class="row">
                            
                          <div  class="col-10">
                            <input type="text " [(ngModel)]="selectedUserDetail.birthday" #resultPickerModel="ngModel"
                            [matDatepicker]="resultPicker" placeholder="Type Date of Birth" class="form-control" />
                              <mat-datepicker #resultPicker>
                              </mat-datepicker>
                            </div>
                            <div  class="col-2">
                              <mat-datepicker-toggle [for]="resultPicker"></mat-datepicker-toggle>
                            </div>
                            </div>
                            <br>
                            <label>Contact No</label>
                            <input type="text" [(ngModel)]="selectedUserDetail.contactNo" placeholder="Type Contact Number" class="form-control"  />
                            <br>
                            <label>Gender</label>
                              <select class="form-control" [(ngModel)]="selectedUserDetail.genderID" >
                                  <option value="0" > --Select Gender-- </option>
                                  <option *ngFor=" let gender of APIGenderList" [value]="gender.id" > {{gender.description}} </option>
                              </select>
                            <br>
                            <label>Email (Username)</label>
                            <input type="text" [(ngModel)]="selectedUserDetail.username" placeholder="Email" class="form-control" readonly/>
                            <br>
                              
                            <br>
                            <!-- <label>Password</label>
                            <input type="password" [(ngModel)]="selectedUserDetail.password" placeholder="Enter Password" class="form-control"required/>
                            <br>
                            <label>Confirm Password</label>
                            <input type="password" [(ngModel)]="confirmpassword" placeholder="Re enter Password" class="form-control"required/>
                            <br> -->
                            <!-- <div class="form-group">
                              <label for="picture">Picture</label>
                              <div class="custom-file">
                                <input type="file" class="custom-file-input" id="customFile"
                                       (change)="onFileChanged($event)" accept=".jpg,.png">
                                <label class="custom-file-label" #labelImport for="customFile">Choose Photo</label>
                              </div>
                            </div> -->
                            <!-- <label>Profile Photo</label>
                              <input type="file" [(ngModel)]="selectedUserDetail.profilePicPath" placeholder="Profile Photo" class="form-control" required (ngModelChange)="onFileChange($event);"/>
                            <img [src]="imageSrc" *ngIf="imageSrc" style="height: 300px; width:500px">
                            <br> -->
                            <label>Security Question 1</label>
                              <select class="form-control" [(ngModel)]="selectedUserDetail.q1Id" >
                                  <option value="0" > --Select Question 1-- </option>
                                  <option *ngFor=" let question of APIQuestionsList" [value]="question.id" > {{( question.question)}} </option>
                              </select>
                              <br>
                            <input type="text" [(ngModel)]="selectedUserDetail.answer1" placeholder="Type Answer for question 1" class="form-control"required />
                            <br>
                              <label>Security Question 2</label>
                              <select class="form-control" [(ngModel)]="selectedUserDetail.q2Id" >
                                  <option value="0" > --Select Question 2-- </option>
                                  <option *ngFor=" let question of APIQuestionsList" [value]="question.id" > {{( question.question)}} </option>
                              </select>
                              <br>
                              <input type="text" [(ngModel)]="selectedUserDetail.answer2" placeholder="Type Answer for question 2" class="form-control"required />
                              <br>
                            <div class="form-group">
                              <button class="btn btn-success col-2" (click)="updateRecord()" ng-disabled="selectedUserDetail.id!==undefined"> Update </button>
                              &nbsp;
                              <button class="btn btn-danger col-2" (click)="resetForm()" > Reset </button>
                           </div> 
                </div>
          </div>
      </div>
      </div>
  </div><!-- /.container-fluid -->
</section>
</div>
