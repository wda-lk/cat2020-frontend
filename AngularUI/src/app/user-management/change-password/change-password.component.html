<!-- Content Wrapper. if not page allowed for user -->
<div *ngIf="!haspermission && !isadmin" class="content-wrapper">
  <div class="row">
    <div class="col-sm-2">
    </div>
        <div class="col-sm-8">
    <div class="w3-display-middle">
      <br><br><br>
      <h2 class="w3-jumbo w3-animate-top w3-center"><code>Access Denied</code></h2>
      <h4 class="w3-center w3-animate-right">You dont have permission to view this page.</h4>
      <h5 class="w3-center w3-animate-zoom">🚫🚫🚫🚫</h5>
      <h6 class="w3-center w3-animate-zoom">error code:403 forbidden</h6>
      </div>
    </div>
  </div>
 </div>
 <!-- End of if not page allowed for user wrapper -->
  <!-- Content Wrapper. Contains page content -->
<div *ngIf="haspermission || isadmin"  class="content-wrapper">
  <!-- Content Header (Page header) -->
  <div class="content-header">
    <div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6">
          <!-- <h4 class="m-0">Change Password</h4> -->
        </div><!-- /.col -->
        <div class="col-sm-6">
          <ol class="breadcrumb float-sm-right">
            <li class="breadcrumb-item">User Management</li>
            <li class="breadcrumb-item active">Change Password</li>
          </ol>
        </div><!-- /.col -->
      </div><!-- /.row -->
    </div><!-- /.container-fluid -->
  </div>
  <!-- /.content-header -->

  <!-- Main content -->
  <section class="content">
    <div class="container-fluid">
          <div class="row">
            
            <div class="col-lg-6 col-md-12">
                <div class="card card-primary">
                    <div class="card-header card-header-primary">
                        <h4 class="card-title ">Change Password</h4>
                        <div class="card-tools">
                          <button type="button" class="btn btn-tool" data-card-widget="collapse" title="Collapse">
                            <i class="fas fa-minus"></i>
                          </button>
                        </div>
                      </div>
                    <div class="card-body">
                      <label>Username </label>
                      <input  [(ngModel)]="userModel.username" placeholder="Username" class="form-control" readonly />
                      <br>
                      <label>Password </label>
                      <input  [(ngModel)]="changePasswordModel.password" type="password" placeholder="Password" class="form-control" />
                      <br>
                      <label>Confirm Password </label>
                      <input  [(ngModel)]="changePasswordModel.confirmpassword" type="password" placeholder="Confirm Password" class="form-control" />
                      <br>
                       <div class="form-group">
                           <input Value="Change" (click)="saveUser()" class="btn btn-success col-2">&nbsp;
                           <input Value="Clear" (click)="clearRecord()" class="btn btn-danger col-2">&nbsp;
                       </div>
                </div>
          </div>
      </div>
      </div>
  </div><!-- /.container-fluid -->
</section>
</div>
