<div class="main-content">
    <div class="container-fluid">
            <div class="row">
              <div class="col-lg-6 col-md-12">
                  <div class="card">
                      <div class="card-header card-header-primary">
                          <h4 class="card-title ">Account Balance</h4>
                          <p class="card-category">Create Account Balance</p>
                      </div>
                      <div class="card-body">
             
                            <div *ngIf="isSinhala;">
                                <label>Select Account</label>
                                <select class="form-control" [(ngModel)]="selectedAccountbalancedetail.accountDetailID" >
                                    <option value="0"> --Select Account--</option>
                                    <option *ngFor=" let accountdetail of APIAccountdetailsList" [value]="accountdetail.id"> {{(accountdetail.nameSinhala + ":" + accountdetail.accountNo )}} </option>
                                </select>
                            </div>
                            <div *ngIf="isTamil;">
                                <label>Select Account</label>
                                <select class="form-control" [(ngModel)]="selectedAccountbalancedetail.accountDetailID" >
                                    <option value="0"> --Select Account--</option>
                                    <option *ngFor=" let accountdetail of APIAccountdetailsList" [value]="accountdetail.id"> {{(accountdetail.nameTamil + ":" + accountdetail.accountNo )}} </option>
                                </select>
                            </div>
                            <div *ngIf="isEnglish;">
                                <label>Select Account</label>
                                <select class="form-control" [(ngModel)]="selectedAccountbalancedetail.accountDetailID" >
                                    <option value="0"> --Select Account--</option>
                                    <option *ngFor=" let accountdetail of APIAccountdetailsList" [value]="accountdetail.id"> {{(accountdetail.nameEnglish + ":" + accountdetail.accountNo )}} </option>
                                </select>
                            </div>
                           
                            <div >
                                <label>Select Year</label>
                                <select class="form-control" [(ngModel)]="selectedAccountbalancedetail.year">
                                 <option value="0"> --Select Year--</option>
                                    <option *ngFor=" let yeardetail of APIYearsList" [value]="yeardetail.description">  {{(yeardetail.description)}}  </option>
                                </select>
                            </div>

                         <!-- <input type="text" [(ngModel)]="selectedAccountbalancedetail.accountdetailID" placeholder="Select Accountdetail" class="form-control"required/> -->
                              <br>
                              <input type="text" [(ngModel)]="selectedAccountbalancedetail.balanceAmount" placeholder="Type Account Balance" class="form-control"required/>
                              <br>
                              <div class="form-group">
                                <button class="btn btn-success" (click)="updateRecord()">{{(selectedAccountbalancedetail.id!==undefined)?'Update':'Create'}}</button>
                                <button class="btn btn-danger" (click)="clearRecord()">Clear</button>
                                <div class="loading" *ngIf="loading">
                                <mat-spinner></mat-spinner>
                            </div>
                      </div>
                  </div>
                </div>
            </div>
              <div class="col-lg-6 col-md-12">
                  <div class="card">
                      <div class="card-header card-header-tabs card-header-primary">
                          <div class="nav-tabs-navigation">
                            <div class="nav-tabs-wrapper">
                                <span class="nav-tabs-title"></span>
                                <ul class="nav nav-tabs" data-tabs="tabs">
                                  <li class="nav-item">
                                      <a mat-button class="nav-link active" href="#inSinhala" data-toggle="tab">
                                          <i class="material-icons"></i> Account Balances List 
                                          <div class="ripple-container"></div>
                                      </a>
                                  </li>
                           
                                </ul>
                            </div>
                          </div>
                      </div>
                      <div class="card-body">
                          <div class="tab-content">
                              
                              <div class="tab-pane active" id="inSinhala">
                                  <table class="table">
                                    <tbody>
                                        <tr>
                                            <th>#</th>
                                              <!-- <th>Account Name</th> -->
                                              <th>Year</th>
                                              <th>Account Balance</th>
                                              <th>Options</th>
                                          </tr>
                                          <tr *ngFor="let accountbalancedetail of APIAccountbalancedetailsList; index as i">
                                              <td>{{ i+1 }}</td>
                                              <!-- <td>AccountdetailName</td> -->
                                              <td>{{ accountbalancedetail.year }}</td>
                                              <td>{{ accountbalancedetail.balanceAmount }}</td>
                                            <td class="td-actions text-right">
                                                <button mat-raised-button (click)="editAccountbalancedetail(accountbalancedetail)" type="button" matTooltip="Edit Task" [matTooltipPosition]="'above'" class="btn btn-primary btn-link btn-sm btn-just-icon">
                                                    <i class="material-icons">edit</i>
                                                </button>
                                                <button (click)="deleteAccountbalancedetail(accountbalancedetail)" mat-raised-button type="button" matTooltip="Remove" [matTooltipPosition]="'above'" class="btn btn-danger btn-link btn-sm btn-just-icon">
                                                    <i class="material-icons">close</i>
                                                </button>
                                            </td>
                                        </tr>
                                    </tbody>
                                  </table>
                              </div>
                              
                          </div>
                      </div>
                  </div>
              </div>
          
        </div>
    </div>
  </div>
