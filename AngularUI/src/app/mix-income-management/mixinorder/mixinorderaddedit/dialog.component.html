<h2 mat-dialog-title class="text-center">Barcode for last receipt</h2>
<mat-dialog-content class="text">
    <ngx-barcode6 [bc-value]="bcValue" [bc-format]="format" [bc-line-color]="lineColor"
    [bc-width]="width" [bc-height]="height" [bc-display-value]="displayValue" [bc-font-options]="fontOptions" [bc-font]="font"
    [bc-text-align]="textAlign" [bc-text-position]="textPosition" [bc-text-margin]="textMargin" [bc-font-size]="fontSize" [bc-background]="background"
    [bc-margin]="margin" [bc-margin-top]="marginTop" [bc-margin-bottom]="marginBottom" [bc-margin-left]="marginLeft" [bc-margin-right]="marginRight"></ngx-barcode6>
</mat-dialog-content>
<mat-dialog-actions align="center" >
  <button mat-raised-button [mat-dialog-close]="true" color="primary">Close</button>
</mat-dialog-actions>
