
<h1 mat-dialog-title>Cancel Order</h1>
<div mat-dialog-content>
  <p>Please type your comment here</p>
  <mat-form-field>
    <input matInput [(ngModel)]="data.usercomment">
  </mat-form-field>
</div>
<div mat-dialog-actions>
  <!-- <button class="btn btn-danger" mat-button (click)="onCancel()">Cancel</button> -->
  <button class="btn btn-success" mat-button [mat-dialog-close]="data.usercomment" 
             cdkFocusInitial>Save</button>
</div>
